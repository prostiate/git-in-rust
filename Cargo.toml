[workspace]
resolver = "2"
members = [
    "crates/gir-core",
    "crates/gir-transport",
    "crates/gir-tui",
    "crates/gir-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Muhammad Irfan Kurniawan <mail@irfankurniawan.com>"]
license = "MIT"
repository = "https://github.com/prostiate/git-in-rust"

[workspace.dependencies]
gir-core = { path = "crates/gir-core" }
gir-transport = { path = "crates/gir-transport" }
gir-tui = { path = "crates/gir-tui" }

clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.4"
flate2 = "1.0"
libc = "0.2"
memmap2 = "0.9"
rayon = "1.10"
sha1 = "0.10"
tempfile = "3.13"
thiserror = "1.0"
